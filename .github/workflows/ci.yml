name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. FRONTEND CI: Test & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # 2. BACKEND API CI: Integration & Unit Tests
  # ==========================================
  backend-ci:
    name: Backend API (Node + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend API Tests
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/bookmart_ci
          JWT_SECRET: ci_secret_jwt_key_testing_12345
          JWT_REFRESH_SECRET: ci_refresh_jwt_key_testing_67890
        run: npm test

  # ==========================================
  # 3. ADMIN SERVER CI: Management API Tests
  # ==========================================
  admin-server-ci:
    name: Admin Server API (Node + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-server

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-server/package.json

      - name: Install Admin Server Dependencies
        run: npm install

      - name: Run Admin Server Tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/bookmart_ci
          JWT_SECRET: ci_secret_jwt_key_testing_12345
          JWT_REFRESH_SECRET: ci_refresh_jwt_key_testing_67890
          ADMIN_DEFAULT_EMAIL: admin@bookmart.com
          ADMIN_DEFAULT_PASSWORD: Admin@123456
        run: npm test
