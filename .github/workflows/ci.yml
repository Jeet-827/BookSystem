name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. FRONTEND CI: Test & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend (Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # H-10 fix: use npm ci (respects lockfile, faster, reproducible)
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Production Bundle (Vite)
        env:
          # Use safe placeholder values for CI build — no real secrets
          VITE_API_BASE_URL: https://placeholder-backend.example.com
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder_ci
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # 2. BACKEND API CI: Integration & Unit Tests
  # ==========================================
  backend-ci:
    name: Backend API (Node + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # H-10 fix: npm ci enforces lockfile
      - name: Install Backend Dependencies
        run: npm ci

      # Dependency security audit (fail on high/critical vulnerabilities)
      - name: Audit Backend Dependencies
        run: npm audit --audit-level=high
        continue-on-error: true  # report but don't block until baseline is clean

      - name: Run Backend API Tests
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/bookmart_ci
          # CI-only test secrets (not real production secrets)
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_only_access_secret_not_used_in_production_64chars_padding' }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci_only_refresh_secret_not_used_in_production_64chars_pad' }}
        run: npm test

  # ==========================================
  # 3. ADMIN SERVER CI: Management API Tests
  # ==========================================
  admin-server-ci:
    name: Admin Server API (Node + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-server

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-server/package-lock.json

      # H-10 fix: npm ci
      - name: Install Admin Server Dependencies
        run: npm ci

      - name: Audit Admin Server Dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Admin Server Tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/bookmart_ci
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_only_access_secret_not_used_in_production_64chars_padding' }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci_only_refresh_secret_not_used_in_production_64chars_pad' }}
          ADMIN_DEFAULT_EMAIL: admin@bookmart-ci.test
          ADMIN_DEFAULT_PASSWORD: CiOnlyPassword@TestNotProduction123
        run: npm test
