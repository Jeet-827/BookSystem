version: '3.8'

# ─── IMPORTANT ────────────────────────────────────────────────────────────────
# Secrets are loaded from .env files at runtime — NEVER hardcoded here.
# Before running: copy backend/.env.example → backend/.env and fill in real values.
# The .env files are excluded from git via .gitignore.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ==========================================
  # 1. MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: bookmart_mongodb
    restart: unless-stopped
    # C-07 / L-02 fix: MongoDB port NOT exposed to host in production.
    # Backend and Admin Server access it via internal Docker network only.
    expose:
      - '27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookmart_network

  # ==========================================
  # 2. Customer Backend API (Port 5000)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmart_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bookmart_network
    user: "node"

  # ==========================================
  # 3. Dedicated Admin Server (Port 5001)
  # ==========================================
  admin-server:
    build:
      context: ./admin-server
      dockerfile: Dockerfile
    container_name: bookmart_admin_server
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file:
      - ./admin-server/.env
    environment:
      NODE_ENV: production
      PORT: 5001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bookmart_network
    user: "node"

  # ==========================================
  # 4. Frontend Web App (Nginx on Port 80)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmart_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
      - admin-server
    networks:
      - bookmart_network

volumes:
  mongo_data:
    driver: local

networks:
  bookmart_network:
    driver: bridge
